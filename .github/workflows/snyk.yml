name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Escaneo semanal los lunes a las 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk-sca:
    name: Snyk Open Source (Firmware & Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@v4

      - name: Export requirements and run Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -f pyproject.toml ]; then
            uv export --no-dev --no-hashes -o requirements.txt
            snyk test --file=requirements.txt --severity-threshold=medium --sarif-file-output=snyk.sarif || {
              code=$?
              if [ $code -eq 1 ]; then
                echo "::warning::Snyk detectó vulnerabilidades en dependencias de Python."
              else
                echo "::error::Error al ejecutar Snyk CLI (código $code)."
                exit $code
              fi
            }
          fi

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
          category: snyk-iot
