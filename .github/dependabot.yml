version: 2
updates:
  # El HAL, la radio y Embassy se publican coordinados: se actualizan juntos para no romper la compilación.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      esp-rs:
        patterns:
          - "esp-*"
          - "embassy-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
