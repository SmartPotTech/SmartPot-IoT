[package]
edition      = "2024"
name         = "smartpot-iot"
rust-version = "1.95"
version      = "0.1.0"
default-run = "smartpot-iot"

[features]
# Perfil seguro por defecto: solo arranque, sin sensores ni red.
# Asi `cargo run` funciona en una placa sin hardware conectado.
default = []

sensors = []
actuators = []

wifi = []

# Reservadas: la implementacion se hara mas adelante.
# Cuando existan, deberian implicar: http-api = ["wifi", "sensors"] y ble = ["sensors"].
http-api = []
ble = []

# MQTT publica telemetria, por lo que necesita sensores y red.
mqtt = ["wifi", "sensors"]

# Perfiles de conveniencia para no encadenar muchas features a mano.
net = ["wifi"]
full = ["sensors", "actuators", "wifi", "mqtt"]

[[bin]]
name = "smartpot-iot"
path = "src/bin/main.rs"

[dependencies]
defmt = "1.2"
static_cell = "2.1.1"
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32"] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32"] }

esp-hal = { version = "1.2.2", features = ["defmt", "esp32", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = [
  "defmt",
  "esp32",
  "unstable",
  "wifi",
  "esp-alloc",
  #"print-logs-from-driver"
] }

embedded-hal-async = "1.0.0"
embedded-tls = { version = "0.19", default-features = false, features = ["embedded-io-adapters", "defmt"] }

embassy-futures = "0.1.2"
embassy-executor = { version = "0.10", features = ["defmt", "executor-thread"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-embedded-hal = "0.6.0"
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dns",
] }

nb = "1.1.0"
heapless = "0.9.3"
rust-mqtt = { version = "0.5", features = ["defmt"]}

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

# The Wi-Fi/BLE blobs require opt-level 2 or 3 to work correctly.
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

