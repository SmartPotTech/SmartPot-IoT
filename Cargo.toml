[package]
edition = "2024"
name = "smartpot-iot"
rust-version = "1.90"
version = "0.1.0"
default-run = "smartpot-iot"

[features]
# Perfil seguro por defecto: solo arranque, sin sensores ni red.
# Asi `cargo run` funciona en una placa sin hardware conectado.
default = ["full"]

sensors = []
# Prototipo físico (3×BME280 tras TCA9548A, BH1750, curvas reales de TDS y pH
# y humidificador). Sin esta feature, la placa es la del firmware MicroPython.
board-physical = ["sensors"]
# Pantalla LCD2004 I2C en un bus propio (I2C1, GPIO16/17).
display = []
actuators = []

wifi = []

# Reservadas: la implementacion se hara mas adelante.
# Cuando existan, deberian implicar: http-api = ["wifi", "sensors"] y ble = ["sensors"].
http-api = []
ble = []

# MQTT publica telemetria, por lo que necesita sensores y red.
mqtt = ["wifi", "sensors"]

# Build para el simulador Wokwi: marcadores de prueba, inyección de comandos por
# la consola serie y el ajuste de interrupciones que necesita el simulador.
# Nunca se incluye en `full`.
sim = []

# Registros internos [INFO ]/[WARN ]/[ERROR]/[DEBUG]. Sin ella, la consola es la
# misma que la del firmware MicroPython.
verbose-logs = []

# Perfiles de conveniencia para no encadenar muchas features a mano.
net = ["wifi"]
full = ["sensors", "actuators", "wifi", "mqtt", "display"]

[[bin]]
name = "smartpot-iot"
path = "src/bin/main.rs"

[dependencies]
defmt = "1.0.1"
static_cell = "2.1.1"
critical-section = "1.2"
esp-println = { version = "0.17.0", features = ["defmt-espflash", "esp32"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32"] }
esp-alloc = { version = "0.10.0", features = ["defmt", "internal-heap-stats"] }
# Manejador de pánico con backtrace; los ganchos apagan actuadores y reinician.
esp-backtrace = { version = "0.19.0", default-features = false, features = [
    "esp32",
    "panic-handler",
    "println",
    "custom-pre-backtrace",
    "custom-halt",
] }

esp-hal = { version = "1.1.0-rc.0", features = ["defmt", "esp32", "unstable"] }
esp-rtos = { version = "0.3.0", features = [
    "defmt",
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32",
] }
esp-radio = { version = "0.18.0", default-features = false, features = [
    "defmt",
    "esp-alloc",
    "esp32",
    "unstable",
    "wifi",
    #"print-logs-from-driver"
] }

embedded-hal-async = "1.0.0"
embedded-io-async = "0.7"
# La cadena del broker se verifica con el acelerador RSA (src/tls.rs), así que
# no hacen falta las verificaciones en software de `rustpki`/`rsa`.
embedded-tls = { version = "0.19", default-features = false, features = ["embedded-io-adapters", "defmt"] }
libm = "0.2"

embassy-futures = "0.1.2"
embassy-executor = { version = "0.10", features = ["defmt", "executor-thread"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-embedded-hal = "0.6.0"
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
    "dns",
] }

nb = "1.1.0"
heapless = "0.9.2"
# Resúmenes para verificar los certificados del broker (misma versión que embedded-tls).
sha2 = { version = "0.10", default-features = false }
rust-mqtt = { version = "0.5", features = ["defmt"] }

[build-dependencies]
# Solo el build script: lee config.json (formato común con el firmware MicroPython).
serde_json = "1"

[profile.dev]
# La compilación de depuración estándar es demasiado lenta y excede la partición de 1 MB
# Para depuración siempre se compila con optimización de tamaño
codegen-units = 1
debug = 2
debug-assertions = false
opt-level = "z"
overflow-checks = false

[profile.release]
codegen-units = 1     # LLVM optimiza mejor utilizando un único hilo de generación de código
debug = 2
debug-assertions = false
incremental = false
lto = false
opt-level = 'z'
overflow-checks = false

# El intercambio de claves P-256 del handshake se calcula en software. Con
# opt-level "z" es más lento en Wokwi, cuya CPU simulada va a unos 8 MHz, y EMQX
# corta los handshakes que pasan de 15 s; estas bibliotecas se optimizan para
# velocidad (el resto sigue en "z" para caber en la partición de 1 MiB).
[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.subtle]
opt-level = 3

[profile.dev.package.ff]
opt-level = 3

[profile.release.package.p256]
opt-level = 3

[profile.release.package.primeorder]
opt-level = 3

[profile.release.package.elliptic-curve]
opt-level = 3

[profile.release.package.crypto-bigint]
opt-level = 3

[profile.release.package.subtle]
opt-level = 3

[profile.release.package.ff]
opt-level = 3
