# Si se bloquea el propio núcleo 0 (donde corre el supervisor), nadie alimenta
# el watchdog RTC y este reinicia el sistema. El build de simulación fija
# WATCHDOG_TIMEOUT_SECS=10.
name: RTC watchdog recovers from a stalled core 0
version: 1
author: SmartPot
steps:
  - wait-serial: 'Serial command injector ready'
  - write-serial: "{\"sim\":\"hang\"}\n"
  - wait-serial: 'SMARTPOT-SIM hang'
  - wait-serial: 'SMARTPOT-READY'
