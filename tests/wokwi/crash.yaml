# Un pánico con la bomba encendida apaga los actuadores, imprime el marcador
# fatal y reinicia el chip, que vuelve a operar sin intervención.
name: Panic turns actuators off and reboots
version: 1
author: SmartPot
steps:
  - wait-serial: 'Serial command injector ready'
  - write-serial: "{\"id\":\"c-1\",\"actuator\":\"WATER_PUMP\",\"action\":\"ACTIVATE\",\"durationSeconds\":60}\n"
  - wait-serial: 'SMARTPOT-ACK c-1 EXECUTED'
  - expect-pin: { part-id: esp, name: '19', value: 1 }
  - write-serial: "{\"sim\":\"panic\"}\n"
  - wait-serial: 'SMARTPOT-FATAL panic'
  - wait-serial: 'SMARTPOT-READY'
  - expect-pin: { part-id: esp, name: '19', value: 0 }
